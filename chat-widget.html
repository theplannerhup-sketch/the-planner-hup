<!--
  The Planner Hup — Chat Assistant Widget
  Copy everything below and paste it right before the closing </body> tag
  on every page of your website (or in your shared footer/layout file, if you have one).

  IMPORTANT: Replace WORKER_URL below with your deployed Cloudflare Worker URL.
-->
<style>
  #tph-chat-bubble {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: #b85b82;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,0.25);
    z-index: 9999;
    border: none;
  }
  #tph-chat-window {
    position: fixed;
    bottom: 90px;
    right: 20px;
    width: 320px;
    max-width: 90vw;
    height: 440px;
    max-height: 70vh;
    background: white;
    border-radius: 14px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.25);
    display: none;
    flex-direction: column;
    overflow: hidden;
    z-index: 9999;
    font-family: system-ui, sans-serif;
  }
  #tph-chat-window.open { display: flex; }
  #tph-chat-header {
    background: #b85b82;
    color: white;
    padding: 12px 16px;
    font-weight: 600;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  #tph-chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    background: #fdf6f9;
  }
  .tph-msg { margin-bottom: 10px; max-width: 85%; padding: 8px 12px; border-radius: 12px; font-size: 14px; line-height: 1.4; }
  .tph-msg.user { background: #b85b82; color: white; margin-left: auto; border-bottom-right-radius: 2px; }
  .tph-msg.bot { background: white; color: #333; border: 1px solid #eee; border-bottom-left-radius: 2px; }
  #tph-chat-input-row { display: flex; border-top: 1px solid #eee; }
  #tph-chat-input { flex: 1; border: none; padding: 12px; font-size: 14px; outline: none; }
  #tph-chat-send { background: #b85b82; color: white; border: none; padding: 0 16px; cursor: pointer; font-size: 16px; }
  #tph-chat-close { background: none; border: none; color: white; font-size: 18px; cursor: pointer; }
</style>

<button id="tph-chat-bubble" aria-label="Chat with us">💬</button>

<div id="tph-chat-window">
  <div id="tph-chat-header">
    <span>Chat with Yue ♡</span>
    <button id="tph-chat-close">✕</button>
  </div>
  <div id="tph-chat-messages"></div>
  <div id="tph-chat-input-row">
    <input id="tph-chat-input" type="text" placeholder="Ask about our planners, books..." />
    <button id="tph-chat-send">➤</button>
  </div>
</div>

<script>
(function () {
  // 🔧 REPLACE THIS with your deployed Cloudflare Worker URL
  const WORKER_URL = "https://YOUR-WORKER-NAME.YOUR-SUBDOMAIN.workers.dev";

  const bubble = document.getElementById("tph-chat-bubble");
  const win = document.getElementById("tph-chat-window");
  const closeBtn = document.getElementById("tph-chat-close");
  const messagesEl = document.getElementById("tph-chat-messages");
  const input = document.getElementById("tph-chat-input");
  const sendBtn = document.getElementById("tph-chat-send");

  let history = [];

  function addMessage(role, text) {
    const div = document.createElement("div");
    div.className = "tph-msg " + (role === "user" ? "user" : "bot");
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function toggleWindow() {
    win.classList.toggle("open");
    if (win.classList.contains("open") && history.length === 0) {
      const greeting = "Hi! I'm Yue ♡ I'm here to help you find the perfect planner, book, or novel. What are you looking for today?";
      addMessage("bot", greeting);
      history.push({ role: "assistant", content: greeting });
    }
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;
    addMessage("user", text);
    history.push({ role: "user", content: text });
    input.value = "";
    sendBtn.disabled = true;

    const typingDiv = document.createElement("div");
    typingDiv.className = "tph-msg bot";
    typingDiv.textContent = "...";
    messagesEl.appendChild(typingDiv);
    messagesEl.scrollTop = messagesEl.scrollHeight;

    try {
      const res = await fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history }),
      });
      const data = await res.json();
      typingDiv.remove();

      if (data.error) {
        addMessage("bot", "Sorry, something went wrong. Please try again in a moment.");
      } else {
        addMessage("bot", data.reply);
        history.push({ role: "assistant", content: data.reply });
      }
    } catch (err) {
      typingDiv.remove();
      addMessage("bot", "Sorry, I couldn't connect right now. Please try again.");
    }
    sendBtn.disabled = false;
  }

  bubble.addEventListener("click", toggleWindow);
  closeBtn.addEventListener("click", toggleWindow);
  sendBtn.addEventListener("click", sendMessage);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendMessage();
  });
})();
</script>
